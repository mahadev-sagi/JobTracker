# -----------------------------------------------------------------------------
# Public webhook gateway.
#
# A tunnel pointed straight at the backend publishes the entire API, including
# unauthenticated CRUD over personal application data. This gateway is what the
# tunnel actually exposes: it forwards only the Gmail push endpoint and a
# health probe, and answers everything else with 404.
#
# The webhook still authenticates for itself (OIDC, or a shared secret in
# development) — this only limits what is reachable at all.
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # Pub/Sub push payloads are small; refuse anything that is not.
    client_max_body_size 1m;

    # Do not advertise the nginx version to the internet.
    server_tokens off;

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Only the Gmail push handler. Note the exact match: /api/webhooks/gmail
    # and nothing else under /api/webhooks/, so the manual test and watch
    # endpoints stay private.
    location = /api/webhooks/gmail {
        proxy_pass http://backend:8000/api/webhooks/gmail;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The bearer token Pub/Sub attaches must survive the hop.
        proxy_set_header Authorization     $http_authorization;

        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
