# =============================================================================
# JobTracker — Docker Compose (Development)
# =============================================================================
# Usage:
#   docker compose up -d          Start all services
#   docker compose up -d --build  Rebuild and start
#   docker compose down -v        Stop and remove volumes
#   docker compose logs -f        Follow logs
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: jobtracker-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
    ports:
      # Host port is overridable: a locally installed PostgreSQL already owns
      # 5432 on some machines. The container-internal port never changes, so
      # the backend's connection to `db:5432` is unaffected either way.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied automatically by the postgres entrypoint on a fresh volume.
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtracker} -d ${POSTGRES_DB:-jobtracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobtracker-net

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtracker-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-jobtracker}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      # Gmail token.json, produced by backend/scripts/bootstrap_gmail_token.py.
      # Read-only: the app refreshes the token in memory and only tries to
      # write it back opportunistically.
      - ./backend/secrets:/app/secrets:ro
    networks:
      - jobtracker-net

  # ---------------------------------------------------------------------------
  # React Frontend (Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${BACKEND_URL:-http://localhost:8000}
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - jobtracker-net

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  jobtracker-net:
    driver: bridge
