# =============================================================================
# Backend tooling configuration.
#
# Ruff's default rule set widens between releases, and CI installs an unpinned
# ruff — so the selection is stated explicitly here to keep local and CI lint
# results identical.
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    # FastAPI's whole dependency-injection API is function calls in argument
    # defaults (Depends(), Query(), Header()). Not a bug here.
    "B008",
    # Long lines are a formatter concern, not a lint failure.
    "E501",
    # str+Enum mixins are load-bearing here: the values are serialised directly
    # into the OpenAI structured-output schema. Migrating to StrEnum changes
    # str() behaviour, so it is a deliberate change, not a lint fix.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports in package initialisers are intentional.
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
